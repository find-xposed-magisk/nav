name: Build web
on:
  push:
    branches:
      - master
      - main
      - dev
      - own
  repository_dispatch:
    types: [1]
  workflow_dispatch: # 允许手动触发 / Allow manual triggering
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 顺序不能换：setup-node 的 cache: pnpm 需要 pnpm 已在 PATH 上，
      # 所以 pnpm/action-setup 必须排在 setup-node 之前。
      # Order matters: setup-node's `cache: pnpm` resolves the pnpm binary,
      # so pnpm/action-setup has to run before setup-node.
      - name: Set pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: pnpm
      # 本仓库的 Actions 为白名单模式，pnpm/action-setup 已加入
      # /repos/{owner}/{repo}/actions/permissions/selected-actions 的 patterns_allowed。
      # 若白名单被重置，症状是 startup_failure（jobs 为 0、无任何日志），
      # 排查入口就是上面那个接口，而不是 run 日志。
      # This repo runs Actions in allow-list mode; pnpm/action-setup is registered in
      # patterns_allowed. If the allow-list is ever reset, the symptom is a
      # startup_failure with zero jobs and no logs — check that endpoint first.
      - name: Install
        run: |
          pnpm install --frozen-lockfile
        env:
          # 构建链路不依赖 puppeteer，跳过其 postinstall 的 Chrome 下载以免 CI 卡住。
          # The build never uses puppeteer; skip its Chrome download.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      # dist/browser/404.html: hashMode 路由的兜底页面 / fallback page for hashMode routing
      - name: Build
        run: |
          npm run build-gh-pages
          cp dist/browser/index.html dist/browser/404.html
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.TOKEN }}
          branch: gh-pages
          folder: dist/browser
          # clean 保持默认 true：每次部署先清空 gh-pages 再写入本次产物。
          # 旧的 hash 文件名 bundle 必须被删除，否则历史上含私有书签的旧包会一直可下载。
          # CNAME 已由 public/CNAME 随产物一起发布，不再依赖残留文件生存。
          # clean stays at the default true: wiping gh-pages each deploy removes stale
          # hashed bundles that still contain private bookmarks. CNAME ships via public/CNAME.
          clean: true

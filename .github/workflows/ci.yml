name: Build web
on:
  push:
    branches:
      - master
      - main
      - dev
      - own
  repository_dispatch:
    types: [1]
  workflow_dispatch: # 允许手动触发 / Allow manual triggering
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
      # 本仓库的 Actions 被限制为白名单模式，未允许 pnpm/action-setup，
      # 直接引用会导致整个工作流 startup_failure（jobs 为 0、无日志）。
      # Node 22 自带 corepack，用它激活 pnpm 不引入新的第三方 action。
      # 如需换成 pnpm/action-setup，请改仓库 Actions 白名单。
      # This repo restricts Actions to an allow-list; pnpm/action-setup is not on it and
      # caused a startup_failure. Corepack ships with Node 22 and needs no extra action.
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version
      - name: Install
        run: |
          pnpm install --frozen-lockfile
        env:
          # 构建链路不依赖 puppeteer，跳过其 postinstall 的 Chrome 下载以免 CI 卡住。
          # The build never uses puppeteer; skip its Chrome download.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      # dist/browser/404.html: hashMode 路由的兜底页面 / fallback page for hashMode routing
      - name: Build
        run: |
          npm run build-gh-pages
          cp dist/browser/index.html dist/browser/404.html
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.TOKEN }}
          branch: gh-pages
          folder: dist/browser
          # clean 保持默认 true：每次部署先清空 gh-pages 再写入本次产物。
          # 旧的 hash 文件名 bundle 必须被删除，否则历史上含私有书签的旧包会一直可下载。
          # CNAME 已由 public/CNAME 随产物一起发布，不再依赖残留文件存活。
          # clean stays at the default true: wiping gh-pages each deploy removes stale
          # hashed bundles that still contain private bookmarks. CNAME ships via public/CNAME.
          clean: true
